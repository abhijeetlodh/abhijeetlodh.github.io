<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDE Case Studies | Abhijeet Lodh</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050510;
            color: #f1f5f9;
            font-family: 'Space Grotesk', sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #0a0a1a;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(0, 245, 212, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #00f5d4, #4cc9f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pdf-viewer {
            width: 100%;
            height: 800px;
            border: 2px solid rgba(0, 245, 212, 0.2);
            border-radius: 16px;
            overflow: auto;
            background: #0a0a0f;
        }
        canvas {
            display: block;
            margin: 0 auto;
            padding: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00f5d4, #4361ee);
            color: black;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-info {
            text-align: center;
            color: #94a3b8;
            margin-top: 15px;
        }
        @media (max-width: 768px) {
            .pdf-viewer { height: 600px; }
            button { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 FDE Case Studies</h1>
        
        <div class="pdf-viewer" id="pdfViewer"></div>
        
        <div class="controls">
            <button onclick="prevPage()">← Previous</button>
            <button onclick="firstPage()">First</button>
            <button onclick="nextPage()">Next →</button>
        </div>
        
        <div class="page-info">
            Page <span id="pageNum">1</span> of <span id="pageCount">0</span>
        </div>
    </div>

    <script>
        const pdfPath = 'your-file.pdf'; // Change to your PDF filename
        let pdf = null;
        let currentPage = 1;

        pdfjsLib.getDocument(pdfPath).promise.then(doc => {
            pdf = doc;
            document.getElementById('pageCount').textContent = doc.numPages;
            renderPage(1);
        });

        function renderPage(num) {
            if (!pdf) return;
            pdf.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: 1.5 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise.then(() => {
                    const viewer = document.getElementById('pdfViewer');
                    viewer.innerHTML = '';
                    viewer.appendChild(canvas);
                    document.getElementById('pageNum').textContent = num;
                    currentPage = num;
                });
            });
        }

        function nextPage() { if (currentPage < pdf.numPages) renderPage(currentPage + 1); }
        function prevPage() { if (currentPage > 1) renderPage(currentPage - 1); }
        function firstPage() { renderPage(1); }
    </script>
</body>
</html>
